    listing_url: "https://icvcm.org/news-insights/"
    link_pattern: "^/[a-z0-9\\-]{35,}/?$"
    confidence: high
    note: "Dùng regex >35 ký tự để bắt slug dài (bài báo), loại trừ /about-us/, /core-carbon-principles/."

  - domain: verra.org
