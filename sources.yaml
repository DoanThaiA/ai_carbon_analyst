    tier: A
    category: energy_official
    group: [1]
    type: html
    listing_url: "https://www.eia.gov/todayinenergy/"
    link_pattern: '/todayinenergy/detail\.php'
    confidence: high
    note: "Tin năng lượng hàng ngày (dầu, khí, điện, than) từ cơ quan thống kê năng lượng Mỹ."

  - domain: eia.gov
