    link_pattern: '/petroleum/supply/weekly/archive/'
    confidence: high
    note: "Tồn kho dầu thô Mỹ, công bố thứ Tư hàng tuần — input trực tiếp cho WTI."

  - domain: eia.gov
    name: "EIA – Natural Gas Weekly Update"
    tier: A
    category: energy_official
    group: [1]
