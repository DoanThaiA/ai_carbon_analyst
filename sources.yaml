    group: [2]
    type: html
    use_playwright: true
    listing_url: "https://www.lseg.com/en/insights"
    link_pattern: "/en/insights/"
    confidence: high
    note: "LSEG Insights — dùng Playwright vì có JS lazy-loading."

  - domain: fastmarkets.com
    name: "Fastmarkets – Carbon Markets"
    tier: B
    category: market_intelligence
    group: [2]
    type: html
    use_playwright: true
    listing_url: "https://www.fastmarkets.com/markets/carbon/"
    link_pattern: "/markets/carbon/"
    confidence: high
    note: "Dùng Playwright — trang có JS lazy-load."

