    listing_url: "https://baochinhphu.vn/chinh-sach-va-cuoc-song.htm"
    link_pattern: "-[0-9]+\\.htm$"
    confidence: high
    note: "Bài viết luôn kết thúc bằng ID, ví dụ: -102260822164252237.htm, giúp loại bỏ trang chuyên mục."

