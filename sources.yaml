  # ==========================================================
  # 1. ENERGY & FOSSIL FUELS
  # ==========================================================

  - domain: eia.gov
    name: "EIA – Today in Energy"
    tier: A
    category: energy_official
    group: [1]
    type: html
    listing_url: "https://www.eia.gov/todayinenergy/"
    link_pattern: "/todayinenergy/detail\\.php"
    confidence: high
    note: "Tin năng lượng chính thức của EIA. Server government đôi khi phản hồi chậm, dùng retry."

  - domain: eia.gov
    name: "EIA – Weekly Petroleum Status Report"
    tier: A
    category: energy_official
    group: [1]
    type: html
    listing_url: "https://www.eia.gov/petroleum/supply/weekly/index.php"
    link_pattern: "/petroleum/supply/weekly/"
    confidence: high
    note: "Weekly Petroleum Status Report. Trang hiện tại có Previous Issues."

  - domain: eia.gov
    name: "EIA – Natural Gas Weekly Update"
    tier: A
    category: energy_official
    group: [1]
    type: html
    listing_url: "https://www.eia.gov/naturalgas/weekly/"
    link_pattern: "/naturalgas/weekly/"
    confidence: high
    note: "Đã cập nhật URL thay cho /naturalgas/storage/weekly/ bị lỗi 404."

  - domain: opec.org
    name: "OPEC – Press Releases"
    tier: A
    category: energy_policy_body
    group: [1]
    type: html
    listing_url: "https://www.opec.org/"
    link_pattern: "/pr-detail/"
    confidence: medium
    note: "Website OPEC mới dùng article URL dạng /pr-detail/NUMBER-DATE.html."

  - domain: argusmedia.com
    name: "Argus Media – Latest Market News"
    tier: B
    category: market_intelligence
    group: [1]
    type: html
    use_playwright: true
    listing_url: "https://www.argusmedia.com/en/news-and-insights/latest-market-news"
    link_pattern: "/en/news-and-insights/latest-market-news/[0-9]+-[a-z0-9\\.\\-]+"
    confidence: high
    note: "Site Next.js (Sitecore JSS) — cần Playwright + domcontentloaded+3s sleep để render link. Article URL dạng /latest-market-news/NUMBERID-slug."

  - domain: ember-energy.org
    name: "Ember Energy – Latest Insights"
    tier: B
    category: research_nonprofit
    group: [1]
    type: html
    listing_url: "https://ember-energy.org/latest-insights/"
    link_pattern: "/latest-insights/"
    confidence: high
    note: "URL bài Ember hiện vẫn sử dụng /latest-insights/."

  # ==========================================================
  # 2. CARBON / ETS / VCM
