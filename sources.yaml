  - domain: dcc.mae.gov.vn
    name: "Cục Biến đổi khí hậu – Tin tức"
    tier: A
    category: policy_official_vn
    group: [3]
    type: html
    listing_url: "https://dcc.mae.gov.vn/"
    link_pattern: "-[0-9]+\\.htm"
    confidence: high
    note: "Bài viết luôn kết thúc bằng ID, ví dụ: -3990.htm."

  - domain: baochinhphu.vn
    name: "Báo Chính phủ – Chính sách và cuộc sống"
    tier: A
