[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally NOT set here — alembic/env.py reads it from
# DATABASE_URL via carbon_analyst.config.Settings (same .env as the rest of
# the app), so it isn't declared in two places. See alembic/env.py.
# NOTE: keep this file ASCII-only — Alembic's Config parses it with the OS
# locale codec (cp1252 on Windows), which crashes on UTF-8 Vietnamese text.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
