[project]
name = "carbon-analyst-mcp"
version = "0.1.1"
description = "MCP server cục bộ cho Claude Desktop — lấy ngữ cảnh báo cáo Carbon Analyst qua API token"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
carbon-analyst-mcp = "carbon_analyst_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbon_analyst_mcp"]
