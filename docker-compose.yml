services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbon_analyst_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbon_analyst"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: carbon_analyst_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Ghi đè URL kết nối DB bằng tên của container 'postgres' thay vì localhost
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/carbon_analyst
    depends_on:
      postgres:
        condition: service_healthy

  crawler_scheduler:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: carbon_analyst_scheduler
    command: python scheduler.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/carbon_analyst
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount thư mục để lưu log
      - scheduler_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://sim.mcv.network
    container_name: carbon_analyst_frontend_v3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3000"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  pgdata:
  scheduler_logs:
