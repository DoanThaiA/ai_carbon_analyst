
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbon_analyst_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbon_analyst"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Scheduler: chạy crawl_prices → crawl_news lúc 6:00 SA mỗi ngày ───────
  crawler_scheduler:
    build: .
    container_name: carbon_analyst_scheduler
    command: python scheduler.py
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app           # mount code để không cần rebuild khi sửa sources.yaml
      - scheduler_logs:/app/logs
    working_dir: /app

volumes:
  pgdata:
    driver: local
  scheduler_logs:
    driver: local
