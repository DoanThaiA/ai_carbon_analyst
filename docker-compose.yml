services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbon_analyst_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Doanthai288@
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbon_analyst"]
      interval: 10s
      timeout: 5s
      retries: 5

  # File đính kèm Quote Chat (ảnh/PDF/Word) — S3-compatible object storage.
  # QUAN TRỌNG: port 9000 (API) cần được reverse-proxy ra 1 domain/subpath
  # PUBLIC-reachable từ trình duyệt (vd storage.mcv.network) — FE PUT thẳng
  # file lên đây bằng presigned URL, KHÔNG đi qua backend. Cấu hình nginx đó
  # nằm NGOÀI repo này. Backend cũng gọi MinIO qua ĐÚNG endpoint public đó
  # (biến MINIO_ENDPOINT trong .env), không qua tên service 'minio' nội bộ —
  # xem comment ở core/config.py::Settings.minio_endpoint.
  minio:
    image: minio/minio:latest
    container_name: carbon_analyst_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"   # API — cần reverse-proxy ra ngoài, xem comment trên
      - "127.0.0.1:9001:9001"   # Console quản trị — chỉ cần truy cập nội bộ/qua SSH tunnel
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: carbon_analyst_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Ghi đè URL kết nối DB bằng tên của container 'postgres' thay vì localhost
      DATABASE_URL: postgresql+asyncpg://postgres:Doanthai288%40@postgres:5432/carbon_analyst
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  crawler_scheduler:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: carbon_analyst_scheduler
    command: python scheduler.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:Doanthai288%40@postgres:5432/carbon_analyst
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount thư mục để lưu log
      - scheduler_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://sim.mcv.network
    container_name: carbon_analyst_frontend_v3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3000"
    env_file:
      - .env
    depends_on:
      - api

volumes:
  pgdata:
  scheduler_logs:
  minio_data:
