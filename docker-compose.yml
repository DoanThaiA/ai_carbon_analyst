
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: carbon_analyst_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbon_analyst"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
