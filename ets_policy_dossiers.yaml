# Hồ sơ chính sách EU ETS/MSR/CBAM ĐANG MỞ — admin cập nhật tay. Luôn hiện ở bảng "Theo dõi chính sách ETS/MSR" (Mục 3) và
# đưa vào prompt Mục 3 + gợi ý kinh doanh, kể cả khi kho tin không có bài (nguồn không nằm trong danh sách crawl).
# services/report_generator.py::_load_ets_dossiers. Hồ sơ đã kết thúc (thông qua/hủy) → đặt closed: true hoặc xoá.
#   item:       tên hồ sơ ngắn
#   stage:      đề xuất | đang đàm phán | đã thông qua | đang áp dụng
#   status:     lập trường/tiến độ đã có nguồn xác nhận (chỉ ghi điều nguồn nêu)
#   next_step:  bước kế tiếp + mốc (không rõ thì "Chưa có lịch xác nhận")
#   impact:     chiều tác động lên NGUỒN CUNG → giá EUA: tăng (siết cung) | giảm (nới cung) | trung lập
#   cbam_effect: (tuỳ chọn) tác động lên chi phí CBAM của nhà xuất khẩu (SIM/khách hàng)
#   supply_mt:  quy mô nguồn cung liên quan (triệu hạn ngạch) nếu nguồn nêu — dùng để xếp thứ tự
#   structural: true = hồ sơ cấu trúc ảnh hưởng lộ trình dài hạn (cap/MSR/phân bổ miễn phí) → kịch bản dài hạn phải chia 2 nhánh
#   source_name / source_date / source_url: nguồn xác nhận (source_url để trống nếu chưa có link — NÊN bổ sung)
#   updated:    ngày admin cập nhật dòng này (YYYY-MM-DD)
