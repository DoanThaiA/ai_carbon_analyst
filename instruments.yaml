# Danh sách instrument cần lấy giá — tất cả crawl từ Barchart.
# Nguồn: crawl_prices/crawl_barchart.py  (BarchartPriceCrawler)
# Chạy hàng ngày lúc 07:00 ICT — lấy giá đóng cửa ngày hôm qua (giờ VN).

